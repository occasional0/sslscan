name: Build sslscan 32-bit

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-windows-32bit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MinGW-w64 (32-bit)
        uses: egor-tensin/setup-mingw@v3
        with:
          platform: x86

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make libssl-dev zlib1g-dev

      - name: Compile sslscan for 32-bit Windows
        run: |
          make -f Makefile.mingw BUILD_32BIT=1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sslscan-32bit
          path: sslscan.exe
